<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>TV Setup</title>
<style>
  @font-face { font-family: "Archivo"; src: url("archivo.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; font-display: swap; }
  :root {
    --body: #1b1e24;      /* graphite, the remote's body */
    --key: #262a32;       /* raised surfaces, like keys */
    --key-hi: #30353f;
    --edge: #3a404b;
    --text: #f2f3f5;
    --muted: #a9b0bd;
    --faint: #7c8494;
    --red: #e5484d;       /* failed */
    --green: #3fb36b;     /* done */
    --yellow: #f0b429;    /* needs you */
    --blue: #3e7bfa;      /* working */
    --r-key: 14px;
    --r-sheet: 22px;
    --pad: 18px;
    --font: "Archivo", system-ui, -apple-system, "Roboto", sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--body); color: var(--text); font-family: var(--font); font-size: 16px; line-height: 1.45; }
  body { min-height: 100vh; padding-bottom: calc(118px + env(safe-area-inset-bottom)); }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .hidden { display: none !important; }

  header.top { display: flex; align-items: center; gap: 12px; padding: 16px var(--pad) 6px; }
  header.top h1 { margin: 0; font-size: 22px; font-weight: 800; font-stretch: 125%; letter-spacing: -0.01em; flex: 1; }
  .icon-btn { width: 42px; height: 42px; border-radius: 50%; border: 0; background: var(--key); display: grid; place-items: center; cursor: pointer; }
  .icon-btn svg { width: 20px; height: 20px; }
  .back { display: none; }
  body.deep .back { display: grid; }

  main { padding: 6px var(--pad) 24px; max-width: 640px; margin: 0 auto; }
  h2 { font-size: 26px; font-weight: 800; font-stretch: 118%; line-height: 1.12; margin: 14px 0 6px; letter-spacing: -0.01em; }
  h3 { font-size: 17px; font-weight: 700; margin: 26px 0 10px; }
  p.lede { color: var(--muted); margin: 0 0 18px; max-width: 62ch; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }

  /* Keys: the main surface element. Two sizes, not one radius for everything. */
  .key { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; background: var(--key); border: 1px solid transparent;
         border-radius: var(--r-key); padding: 14px 16px; margin: 0 0 10px; cursor: pointer; box-shadow: 0 2px 0 #12141880; }
  .key:active { transform: translateY(1px); box-shadow: none; background: var(--key-hi); }
  .key .grow { flex: 1; min-width: 0; }
  .key .title { font-weight: 700; display: block; }
  .key .sub { font-size: 13px; color: var(--muted); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .glyph { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--body); flex: none; font-weight: 800; font-stretch: 125%; font-size: 14px; }
  .chev { color: var(--faint); }

  .device-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .device-grid .key { flex-direction: column; align-items: flex-start; gap: 10px; margin: 0; min-height: 112px; }
  .device-grid .key .sub { white-space: normal; }

  .empty { border: 1.5px dashed var(--edge); border-radius: var(--r-key); padding: 18px; color: var(--muted); }

  /* Status dots: the remote's color keys. */
  .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--edge); flex: none; }
  .dot.blue { background: var(--blue); box-shadow: 0 0 0 4px #3e7bfa33; }
  .dot.green { background: var(--green); }
  .dot.yellow { background: var(--yellow); box-shadow: 0 0 0 4px #f0b42933; }
  .dot.red { background: var(--red); }
  .pill { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; background: var(--key); font-size: 13px; color: var(--muted); }

  label.field { display: block; margin: 0 0 14px; }
  label.field > span { display: block; font-size: 14px; color: var(--muted); margin-bottom: 6px; }
  input[type=text], input[type=password], select { width: 100%; background: var(--key); border: 1px solid var(--edge); border-radius: 12px; padding: 13px 14px; font-size: 17px; }
  input.code { font-stretch: 125%; letter-spacing: 0.18em; font-weight: 700; text-transform: uppercase; }

  /* Choice rows (radio / toggle) */
  .group { background: var(--key); border-radius: var(--r-sheet); padding: 6px 0; margin-bottom: 14px; }
  .group > .head { padding: 12px 16px 6px; display: flex; align-items: baseline; gap: 10px; }
  .group > .head b { font-size: 17px; }
  .group > .head .muted { font-size: 13px; }
  .opt { display: flex; gap: 14px; align-items: flex-start; padding: 12px 16px; cursor: pointer; }
  .opt + .opt { border-top: 1px solid #ffffff0d; }
  .opt input { margin: 3px 0 0; width: 20px; height: 20px; accent-color: var(--blue); flex: none; }
  .opt .t { font-weight: 600; display: block; }
  .opt .d { font-size: 13px; color: var(--muted); display: block; }
  .tag { font-size: 12px; font-weight: 700; color: var(--green); margin-left: 6px; }
  .link { background: none; border: 0; color: #8fb0ff; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

  /* How-to steps really are a sequence, so they're numbered. */
  ol.howto { margin: 0 0 16px; padding: 0; list-style: none; counter-reset: s; }
  ol.howto li { counter-increment: s; display: grid; grid-template-columns: 30px 1fr; gap: 10px; padding: 8px 0; color: var(--text); }
  ol.howto li::before { content: counter(s); width: 26px; height: 26px; border-radius: 50%; background: var(--key); display: grid; place-items: center; font-size: 13px; font-weight: 700; color: var(--muted); }
  ol.howto b { font-weight: 700; }

  details.help { background: var(--key); border-radius: var(--r-key); margin: 0 0 12px; }
  details.help > summary { cursor: pointer; padding: 13px 16px; font-weight: 650; list-style: none; display: flex; align-items: center; gap: 10px; }
  details.help > summary::-webkit-details-marker { display: none; }
  details.help > summary::after { content: "+"; margin-left: auto; color: var(--faint); font-size: 20px; line-height: 1; }
  details.help[open] > summary::after { content: "−"; }
  details.help > .inner { padding: 0 16px 12px; }
  details.help ul { margin: 0; padding-left: 18px; color: var(--muted); font-size: 14px; }
  details.help ul li { margin: 0 0 8px; }
  details.help ol.howto li::before { background: var(--body); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 14px; }
  .chip { border: 1px solid var(--edge); background: var(--key); border-radius: 999px; padding: 8px 14px; cursor: pointer; font-weight: 650; }
  .chip.on { background: var(--blue); border-color: var(--blue); color: #fff; }
  .verdict { border-radius: var(--r-sheet); padding: 16px 18px; background: var(--key); margin: 0 0 16px; }
  .verdict.warn { box-shadow: inset 4px 0 0 var(--yellow); }
  .verdict.ok { box-shadow: inset 4px 0 0 var(--green); }
  .verdict b { display: block; font-size: 17px; margin-bottom: 4px; }
  .port { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 12px; background: var(--key); margin: 0 0 16px; font-size: 14px; }

  /* Run view */
  .steps { list-style: none; padding: 0; margin: 10px 0 0; }
  .steps li { display: grid; grid-template-columns: 18px 1fr; gap: 14px; padding: 12px 0; border-bottom: 1px solid #ffffff0d; }
  .steps li .dot { margin-top: 5px; }
  .steps .label { font-weight: 650; }
  .steps .detail { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
  .steps li.waiting { background: #f0b42914; margin: 0 calc(var(--pad) * -1); padding-left: var(--pad); padding-right: var(--pad); }
  .steps li.waiting .detail { color: var(--yellow); font-size: 15px; font-weight: 600; }
  .steps li.skipped .label { color: var(--faint); }
  .bar { height: 6px; background: var(--body); border-radius: 3px; margin-top: 8px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--blue); width: 0; transition: width .25s linear; }
  .signin { background: #f0b42914; border: 1px solid #f0b42955; border-radius: var(--r-key); padding: 16px; margin: 14px 0; }
  .signin a.cta { display: block; text-align: center; padding: 13px; border-radius: 12px; background: var(--text); color: var(--body); font-weight: 800; text-decoration: none; margin: 10px 0 8px; }
  details.log { margin-top: 18px; }
  details.log summary { color: var(--muted); cursor: pointer; font-size: 14px; }
  .logbox { margin-top: 8px; max-height: 300px; overflow: auto; font-size: 12px; line-height: 1.5; background: #14161b; border-radius: 12px; padding: 10px 12px; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; }
  .logbox .error { color: #ff8a8d; } .logbox .success { color: #7fd8a0; }

  .result { border-radius: var(--r-sheet); padding: 18px; margin: 18px 0 0; background: var(--key); }
  .result.ok { box-shadow: inset 4px 0 0 var(--green); }
  .result.bad { box-shadow: inset 4px 0 0 var(--red); }

  /* The OK button: the one bold thing. */
  .dock { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px var(--pad) calc(14px + env(safe-area-inset-bottom)); background: linear-gradient(transparent, var(--body) 28%); display: flex; align-items: center; gap: 14px; justify-content: flex-end; pointer-events: none; }
  .dock > * { pointer-events: auto; }
  .dock .hint { flex: 1; text-align: right; line-height: 1.25; }
  .dock .hint b { display: block; font-size: 19px; font-weight: 800; font-stretch: 112%; color: var(--text); }
  .dock .hint span { font-size: 13px; color: var(--muted); }
  .ok-btn { width: 84px; height: 84px; border-radius: 50%; border: 0; background: radial-gradient(circle at 50% 38%, #4c87ff, var(--blue) 62%, #2f63d4); color: #fff; font-weight: 800; font-stretch: 125%; font-size: 15px; letter-spacing: 0.02em; cursor: pointer;
            box-shadow: 0 0 0 6px var(--key), 0 0 0 7px var(--edge), 0 10px 24px #0008; }
  .ok-btn:active { transform: scale(0.96); }
  .ok-btn:disabled { background: var(--key-hi); color: var(--faint); }
  .ok-btn.go { animation: ring 1.8s ease-out 1; }
  @keyframes ring { 0% { box-shadow: 0 0 0 6px var(--key), 0 0 0 7px var(--edge), 0 0 0 7px #3e7bfa88; } 100% { box-shadow: 0 0 0 6px var(--key), 0 0 0 7px var(--edge), 0 0 0 26px #3e7bfa00; } }
  @media (prefers-reduced-motion: reduce) { .ok-btn.go { animation: none; } .bar i { transition: none; } }

  /* Bottom sheet */
  .scrim { position: fixed; inset: 0; background: #0009; z-index: 20; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 88vh; overflow: auto; background: #20242b; border-radius: var(--r-sheet) var(--r-sheet) 0 0; z-index: 21; padding: 10px var(--pad) calc(24px + env(safe-area-inset-bottom)); }
  .sheet .grab { width: 44px; height: 5px; border-radius: 3px; background: var(--edge); margin: 4px auto 10px; }
  .sheet h2 { margin-top: 4px; }
  .pkg { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid #ffffff0d; align-items: flex-start; }
  .pkg input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--blue); flex: none; }
  .pkg code { font-size: 13px; color: var(--text); overflow-wrap: anywhere; }
  .pkg .note { font-size: 12px; color: var(--muted); display: block; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 16px; border-radius: 12px; border: 1px solid var(--edge); background: var(--key); cursor: pointer; font-weight: 650; }
  .btn.full { width: 100%; }
  .btn.danger { color: #ff8a8d; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(120px + env(safe-area-inset-bottom)); background: var(--text); color: var(--body); padding: 10px 16px; border-radius: 999px; font-weight: 650; z-index: 30; font-size: 14px; max-width: 90vw; }
  .scanbar { height: 3px; border-radius: 2px; background: var(--key); overflow: hidden; margin: 6px 0 12px; }
  .scanbar i { display: block; height: 100%; width: 0; background: var(--blue); }
</style>
</head>
<body>
<header class="top">
  <button class="icon-btn back" id="back" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
  <h1 id="title">TV Setup</h1>
  <button class="icon-btn" id="open-settings" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg></button>
</header>

<main id="view"></main>

<div class="dock" id="dock"><span class="hint" id="dock-hint"></span><button class="ok-btn" id="ok" disabled>OK</button></div>
<div id="sheet-root"></div>
<input type="file" id="file-input" class="hidden">

<script>
"use strict";
const token = new URLSearchParams(location.search).get("t") || "";
const bridge = window.AndroidBridge || null;
const $ = (id) => document.getElementById(id);
const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

async function invoke(channel, ...args) {
  const response = await fetch(`/api/invoke?t=${encodeURIComponent(token)}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ channel, args }) });
  const body = await response.json();
  if (body.error) throw new Error(body.error);
  return body.result;
}
async function upload(file) {
  const response = await fetch(`/api/upload?t=${encodeURIComponent(token)}&name=${encodeURIComponent(file.name)}`, { method: "POST", body: file });
  const body = await response.json();
  if (body.error) throw new Error(body.error);
  return body.path;
}
function pickFile(accept) {
  return new Promise((resolve) => {
    const input = $("file-input");
    input.value = "";
    input.accept = accept;
    input.onchange = () => resolve(input.files[0] || null);
    input.click();
  });
}
function toast(text, ms = 2600) {
  const el = document.createElement("div");
  el.className = "toast"; el.textContent = text; document.body.appendChild(el);
  setTimeout(() => el.remove(), ms);
}
function phoneIp() { try { return (bridge && bridge.getWifiIp()) || ""; } catch { return ""; } }
function keepAwake(on) { try { bridge?.keepScreenOn(on); } catch {} }

// ---------------- State & routing ----------------
const state = { info: null, view: "home", stack: [], scan: { running: false, found: [], fraction: 0 }, target: null, summary: null, choices: null, job: null, log: [] };

function go(view, params = {}, replace = false) {
  if (!replace && state.view !== view) state.stack.push(state.view);
  state.view = view;
  Object.assign(state, params);
  render();
  window.scrollTo(0, 0);
}
function back() {
  if (state.view === "run" && state.job && state.job.status === "running") { toast("Setup is still running. It'll keep going if you leave the app open."); return; }
  const previous = state.stack.pop() || "home";
  state.view = previous;
  render();
}
$("back").onclick = back;
$("open-settings").onclick = () => openSettings();

// The round button always reads OK, like a remote; the action it takes is written beside it.
function setDock(action, hint, onClick, { enabled = true, pulse = false } = {}) {
  const ok = $("ok");
  ok.textContent = enabled ? "OK" : "···"; ok.disabled = !enabled; ok.onclick = onClick;
  ok.setAttribute("aria-label", action || "OK");
  ok.classList.toggle("go", pulse);
  $("dock-hint").innerHTML = action ? `<b>${esc(action)}</b><span>${esc(hint || "")}</span>` : "";
  $("dock").classList.toggle("hidden", !action);
}

// ---------------- Profiles & instructions ----------------
const GLYPH = { samsung: "Sa", "samsung-old": "Sa", lg: "LG", shield: "Nv", onn: "onn", sony: "Sy", androidtv: "TV", firetv: "Fi", chromecast: "TV" };
// Developer mode, per device. steps: the short path; more: other models; tips: when it doesn't work.
const GUIDES = {
  samsung: {
    steps: ["On the TV, press <b>Home</b> and open <b>Apps</b>.",
      "With Apps open, enter <b>1 2 3 4 5</b> on the remote. No number keys? Press the <b>123</b> or color button to bring up the on-screen keypad.",
      "Turn <b>Developer mode</b> on. In <b>Host PC IP</b>, enter this phone's IP (shown below), then choose OK.",
      "Restart the TV: hold the remote's power button until the Samsung logo shows. The Apps screen now says Developer Mode at the top."],
    tips: ["Nothing happens after 1 2 3 4 5: make sure the Apps screen is open (not the home bar) and enter the numbers a little faster.",
      "Host PC IP has to be this phone. If the phone's IP changes, enter the new one and restart the TV again.",
      "Developer mode stays on after restarts. Leave it on; updates need it.",
      "TV from 2017 or older? Go back and pick <b>Older Samsung</b>. Nuvio can't run on those, but a streaming stick can."],
    ip: "Settings → General → Network → Network Status → IP Settings."
  },
  lg: {
    steps: ["On this phone, create a free LG Developer account at <a class=\"link\" href=\"https://webostv.developer.lge.com\">webostv.developer.lge.com</a> and confirm the email it sends.",
      "On the TV, open the <b>LG Content Store</b> (Apps), search for <b>Developer Mode</b> and install it.",
      "Open Developer Mode, sign in with that account and turn <b>Dev Mode Status</b> on. The TV restarts.",
      "Open Developer Mode again and turn on <b>Key Server</b>. Type the 6-character <b>Passphrase</b> it shows into the box below."],
    tips: ["Dev Mode Status won't turn on: the account's email isn't confirmed yet, or the TV's date and time are wrong.",
      "Developer Mode runs out after about 50 hours unless it's extended. This app extends it every time you open it, so open TV Setup on the same Wi-Fi now and then.",
      "Key Server only has to be on while this app connects the first time."],
    ip: "Settings → Network → Wi-Fi Connection → your network → Advanced Wi-Fi Settings."
  },
  shield: {
    steps: ["Open <b>Settings → Device Preferences → About</b>.", "Select <b>Build</b> 7 times until it says you're a developer.",
      "Go back to <b>Device Preferences → Developer options</b>.", "Turn on <b>Network debugging</b> (and <b>USB debugging</b>)."],
    tips: ["Shield updates sometimes turn Network debugging off. Turn it back on if this app can't reach the Shield.",
      "The Shield asks <b>Allow network debugging?</b> the first time. Tick Always allow."],
    ip: "Settings → Network & Internet → your network."
  },
  onn: {
    steps: ["Open <b>Settings → System → About</b>.", "Select <b>Android TV OS build</b> 7 times. Enter your PIN if it asks.",
      "Go back to <b>System → Developer options</b>.", "Turn on <b>USB debugging</b>. On onn boxes this also opens network debugging."],
    tips: ["Developer options missing: select the build number again until it says you're a developer."],
    ip: "Settings → Network & Internet → your network."
  },
  sony: {
    steps: ["Open <b>Settings → System → About</b>.", "Select <b>Build</b> 7 times.", "Go back to <b>System → Developer options</b>.",
      "Turn on <b>USB debugging</b> (and <b>Network debugging</b> if you see it)."],
    more: [{ title: "Older Sony Android TV (2015 to 2020)", steps: ["Open <b>Settings → Device Preferences → About</b> and select <b>Build</b> 7 times.", "Open <b>Device Preferences → Developer options</b> and turn on <b>USB debugging</b>."] }],
    ip: "Settings → Network & Internet → your network."
  },
  androidtv: {
    steps: ["Open <b>Settings → System</b> (or Device Preferences) <b>→ About</b>.", "Select <b>Build</b> or <b>Android TV OS build</b> 7 times.",
      "Open <b>Developer options</b>.", "Turn on <b>USB debugging</b>, and <b>Network debugging</b> if it's there."],
    tips: ["TCL, Hisense and Philips TVs sometimes hide About under <b>Device Preferences</b> or <b>System → About → Version</b>.",
      "Chromecast with Google TV: the same steps; it lists Developer options under System."],
    ip: "Settings → Network & Internet → your network."
  },
  firetv: {
    steps: ["Open <b>Settings → My Fire TV → About</b>.",
      "Select the first item, the device's name (like Fire TV Stick 4K Max), 7 times until it says <b>No need, you are already a developer</b>.",
      "Press Back, open <b>Developer Options</b> and turn on <b>ADB Debugging</b>.",
      "When the Fire TV asks <b>Allow USB debugging?</b>, tick Always allow and choose OK."],
    more: [{ title: "Older Fire TV (2019 and earlier, Fire OS 6)", steps: ["<b>Developer Options</b> is already in <b>Settings → My Fire TV</b> (or <b>Device</b>). Open it and turn on <b>ADB Debugging</b>."] }],
    tips: ["<b>Apps from Unknown Sources</b> isn't needed. This phone installs over ADB debugging.",
      "If the software version under About starts with <b>1.</b>, the stick runs Vega OS (Fire TV Stick 4K Select and the newest Fire TV Sticks). Vega OS can't install Android apps, so Nuvio can't go on it.",
      "Fire TV keeps Amazon's home screen installed. The clean screen answers the Home button and covers Amazon's."],
    ip: "Settings → My Fire TV → About → Network."
  }
};
GUIDES.chromecast = GUIDES.androidtv;
const HOWTO = Object.fromEntries(Object.entries(GUIDES).map(([id, g]) => [id, g.steps]));

function guideExtras(id) {
  const g = GUIDES[id] || GUIDES.androidtv;
  const more = (g.more || []).map((m) => `<details class="help"><summary>${esc(m.title)}</summary><div class="inner"><ol class="howto">${m.steps.map((x) => `<li><span>${x}</span></li>`).join("")}</ol></div></details>`).join("");
  const tips = g.tips?.length ? `<details class="help"><summary>Not working?</summary><div class="inner"><ul>${g.tips.map((t) => `<li>${t}</li>`).join("")}</ul></div></details>` : "";
  return more + tips;
}

// Older Samsung (2011 to 2017): no Nuvio build runs there. Developer access for reference, and the stick route.
const ORSAY = {
  D: { label: "2011 (D)", steps: ["Open Smart Hub and press <b>A</b> (red) to log in.", "Create an account named <b>develop</b>. The password usually fills in by itself.",
    "Log in, press <b>D</b> (blue) or Tools, then go to <b>Settings → Development → Setting Server IP</b>.", "Enter the computer's IP, then choose <b>User Application Synchronization</b>."] },
  E: { label: "2012 (E)", steps: ["Open Smart Hub, press <b>A</b> (red) and log in as <b>develop</b> (the password fills in, or try sso1029dev!).",
    "Tools → <b>Settings → Development → Server IP setting</b>.", "Run <b>User Application Synchronization</b>."] },

function profile(id) { return state.info?.profiles.find((p) => p.id === id) || { id, platform: "android", label: "TV" }; }

// ---------------- Views ----------------
function render() {
  document.body.classList.toggle("deep", state.view !== "home");
  const views = { home: viewHome, pick: viewPick, connect: viewConnect, plan: viewPlan, run: viewRun, guide: viewGuide, oldsamsung: viewOldSamsung };
  $("title").textContent = { home: "TV Setup", pick: "Set up a TV", connect: "Connect", plan: "Your setup", run: state.job?.title || "Setting up", guide: "Developer mode", oldsamsung: "Older Samsung" }[state.view];
  (views[state.view] || viewHome)();
}

function deviceRow(device) {
  const when = device.lastSetup ? `set up ${relTime(device.lastSetup)}` : "not set up yet";
  return `<button class="key" data-device="${esc(device.id)}">
    <span class="glyph">${esc(GLYPH[device.profile] || "TV")}</span>
    <span class="grow"><span class="title">${esc(device.name || "TV")}</span><span class="sub">${esc(device.ip)}, ${esc(device.os || device.platform)}, ${esc(when)}</span></span>
    <span class="chev">›</span></button>`;
}
function relTime(t) {
  const m = Math.round((Date.now() - t) / 60000);
  if (m < 2) return "just now"; if (m < 60) return `${m} min ago`;
  const h = Math.round(m / 60); if (h < 36) return `${h} h ago`;
  return `${Math.round(h / 24)} days ago`;
}

function viewHome() {
  const devices = state.info?.devices || [];
  const found = state.scan.found.filter((f) => !devices.some((d) => d.ip === f.ip && d.platform === f.platform));
  $("view").innerHTML = `
    <h2>${devices.length ? "Your TVs" : "Let's set up a TV"}</h2>
    <p class="lede">${devices.length ? "Tap a TV to update Nuvio or run setup again." : "Install Nuvio, swap in a clean home screen and strip out ads and tracking. Takes about 5 minutes per TV."}</p>
    <div id="saved">${devices.map(deviceRow).join("")}</div>
    <h3>On this Wi-Fi</h3>
    <div class="scanbar ${state.scan.running ? "" : "hidden"}"><i style="width:${Math.round(state.scan.fraction * 100)}%"></i></div>
    <div id="found">${found.map((f) => `<button class="key" data-found="${esc(f.ip)}">
        <span class="glyph">${esc(GLYPH[f.profile] || "TV")}</span>
        <span class="grow"><span class="title">${esc(f.name || f.model || f.maker || "TV")}</span><span class="sub">${esc(f.ip)}, ${esc(f.model || f.maker || f.platform)}${f.devMode ? ", ready" : ", developer mode off"}</span></span>
        <span class="dot ${f.devMode ? "green" : "yellow"}"></span></button>`).join("") ||
      (state.scan.running ? `<p class="muted small">Looking for TVs…</p>` : `<div class="empty">No other TVs found yet. Tap Scan, or pick your TV type with Set up.</div>`)}</div>
    <div class="row" style="margin-top:6px"><button class="btn" id="scan-btn" ${state.scan.running ? "disabled" : ""}>${state.scan.running ? "Scanning…" : "Scan Wi-Fi"}</button></div>
    ${prepChip()}`;
  document.querySelectorAll("[data-device]").forEach((el) => el.onclick = () => openDevice(el.dataset.device));
  document.querySelectorAll("[data-found]").forEach((el) => el.onclick = () => {
    const f = state.scan.found.find((item) => item.ip === el.dataset.found);
    if (f.profile === "samsung-old") { go("oldsamsung", { old: { model: f.model || "", year: f.year || 0, ip: f.ip, legacy: Boolean(f.legacy) } }); return; }
    go("connect", { target: { profile: f.profile || (f.platform === "android" ? "androidtv" : f.platform), ip: f.ip, name: f.name || f.model } });
  });
  $("scan-btn").onclick = runScan;
  setDock("Set up a TV", devices.length ? "Add another one" : "Pick your TV type", () => go("pick"), { pulse: !devices.length });
}

function prepChip() {
  const s = state.info?.settings || {};
  if (!s.lastPrepared) return "";
  return `<p class="small muted" style="margin-top:22px"><span class="pill"><span class="dot green"></span>Downloads ready, checked ${esc(relTime(s.lastPrepared))}</span></p>`;
}

async function runScan() {
  const ip = phoneIp();
  if (!ip) { toast("Connect the phone to Wi-Fi first."); return; }
  state.scan = { running: true, found: [], fraction: 0 };
  render();
  try { state.scan.found = await invoke("scan:run", ip); }
  catch (error) { toast(error.message); }
  state.scan.running = false;
  if (state.view === "home") render();
}

function viewPick() {
  const profiles = state.info?.profiles || [];
  $("view").innerHTML = `<h2>What are you setting up?</h2><p class="lede">Each one gets the best Nuvio build for it and the clean-up steps that are safe on that system.</p>
    <div class="device-grid">${profiles.map((p) => `<button class="key" data-profile="${p.id}"><span class="glyph">${esc(GLYPH[p.id])}</span><span><span class="title">${esc(p.label)}</span><span class="sub">${esc(p.sub)}</span></span></button>`).join("")}</div>`;
  $("view").insertAdjacentHTML("beforeend", `<button class="key" id="guide-btn" style="margin-top:16px"><span class="glyph">?</span><span class="grow"><span class="title">How to turn on developer mode</span><span class="sub">Every TV and box, with fixes for when it won't turn on</span></span><span class="chev">›</span></button>`);
  document.querySelectorAll("[data-profile]").forEach((el) => el.onclick = () => el.dataset.profile === "samsung-old"
    ? go("oldsamsung", { old: { model: "", year: 0 } })
    : go("connect", { target: { profile: el.dataset.profile, ip: "" } }));
  $("guide-btn").onclick = () => go("guide");
  setDock("", "", null);
}

let portTimer = null;
function viewConnect() {
  const t = state.target; const p = profile(t.profile);
  const isLg = p.platform === "lg"; const isSamsung = p.platform === "samsung";
  $("view").innerHTML = `
    <h2>${esc(p.label)}</h2>
    <p class="lede">Turn on developer mode once. Setup and future updates then run from this phone.</p>
    <ol class="howto">${(HOWTO[t.profile] || HOWTO.androidtv).map((s) => `<li><span>${s}</span></li>`).join("")}</ol>
    ${guideExtras(t.profile)}
    ${isSamsung ? `<div class="port"><span>This phone's IP:</span><b id="my-ip">${esc(phoneIp() || "not on Wi-Fi")}</b><button class="link" id="copy-ip">Copy</button></div>` : ""}
    <label class="field"><span>TV's IP address</span><input type="text" id="ip" inputmode="decimal" placeholder="192.168.1.50" value="${esc(t.ip || "")}"></label>
    ${isLg ? `<label class="field"><span>Passphrase from the Developer Mode app</span><input type="text" id="pass" class="code" maxlength="6" autocomplete="off" autocapitalize="characters" value="${esc(t.passphrase || "")}"></label>` : ""}
    <div class="port" id="port"><span class="dot"></span><span id="port-text">Enter the TV's IP address</span></div>
    <p class="small muted">${p.platform === "android" ? "The TV shows <b>Allow USB debugging?</b> the first time. Choose Allow and tick Always allow. " : ""}Find the IP under ${(GUIDES[t.profile] || GUIDES.androidtv).ip}</p>`;
  $("copy-ip")?.addEventListener("click", () => { bridge?.copyText(phoneIp()); toast("Copied"); });
  const check = async () => {
    const ip = $("ip")?.value.trim();
    if (!ip || state.view !== "connect") return;
    const ports = await invoke("device:check", { ip, platform: p.platform }).catch(() => ({}));
    if (state.view !== "connect") return;
    const ready = p.platform === "android" ? ports[5555] : p.platform === "samsung" ? ports[26101] : ports[9922] && ports[9991];
    const seen = Object.values(ports).some(Boolean);
    const dot = document.querySelector("#port .dot");
    if (!dot) return;
    dot.className = `dot ${ready ? "green" : seen ? "yellow" : ""}`;
    $("port-text").textContent = ready ? "The TV is ready to connect" :
      seen ? (p.platform === "lg" && ports[9922] ? "Turn on Key Server in the Developer Mode app" : "Found the TV, but developer mode isn't on yet") : "No answer yet. Check the IP and that the TV is on.";
  };
  clearInterval(portTimer);
  portTimer = setInterval(() => { if (state.view !== "connect") clearInterval(portTimer); else check(); }, 3000);
  $("ip").addEventListener("change", check);
  check();
  setDock("Connect", "Reads the TV, changes nothing yet", connectNow);
}

async function connectNow() {
  const p = profile(state.target.profile);
  const ip = $("ip").value.trim();
  if (!/^\d+\.\d+\.\d+\.\d+(:\d+)?$/.test(ip)) { toast("Enter the TV's IP address, like 192.168.1.50."); return; }
  const passphrase = $("pass")?.value.trim().toUpperCase() || "";
  const savedLg = (state.info?.devices || []).some((d) => d.platform === "lg" && d.ip === ip && d.hasLgKey);
  if (p.platform === "lg" && passphrase.length !== 6 && !savedLg) { toast("Enter the 6-character passphrase from the TV."); return; }
  state.target = { ...state.target, ip, passphrase };
  setDock("Connecting…", p.platform === "android" ? "Accept the prompt on the TV" : "Signing in to the TV", null, { enabled: false });
  try {
    const summary = await invoke("device:inspect", { profile: state.target.profile, ip, passphrase });
    clearInterval(portTimer);
    state.summary = summary;
    state.choices = defaultChoices(summary);
    go("plan");
  } catch (error) {
    toast(error.message, 5200);
    setDock("Connect", "Try again", connectNow);
  }
}

function defaultChoices(s) {
  if (s.platform === "samsung") return { legacyVariant: s.recommendations.legacyVariant || "auto" };
  if (s.platform === "lg") return { nuvio: s.installed?.nuvioVersion ? "default" : "default", home: true, bootHome: Boolean(s.rooted) };
  const selected = s.debloat.categories.flatMap((c) => c.items.filter((i) => i.selected).map((i) => i.pkg));
  const hz = state.info?.settings?.horizon || {};
  return { nuvio: s.recommendations.nuvio, homeMode: s.recommendations.homeMode, homeStyle: s.recommendations.homeStyle || "clean", debloat: selected, speed: true, smarttube: false, replaceIncompatible: false, dnsBlock: Boolean(hz.nextdnsId) };
}

function radio(name, value, current, title, desc, recommended) {
  return `<label class="opt"><input type="radio" name="${name}" value="${esc(value)}" ${current === value ? "checked" : ""}><span><span class="t">${esc(title)}${recommended ? `<span class="tag">Recommended</span>` : ""}</span>${desc ? `<span class="d">${desc}</span>` : ""}</span></label>`;
}
function toggle(name, checked, title, desc) {
  return `<label class="opt"><input type="checkbox" name="${name}" ${checked ? "checked" : ""}><span><span class="t">${esc(title)}</span>${desc ? `<span class="d">${desc}</span>` : ""}</span></label>`;
}

      radio("home", "none", c.homeMode, "Keep Amazon's home screen", "")) :

      radio("home", "replace", c.homeMode, "Replace the home screen", s.isGoogleTv ? "Turns off Google TV's home. Casting from phones can stop working on Google TV." : "Turns off the stock home. Undo brings it back.", rec.homeMode === "replace") +
      radio("home", "redirect", c.homeMode, "Home button opens the clean screen", "Keeps the stock home and casting working behind it.", rec.homeMode === "redirect") +

    const hz = state.info?.settings?.horizon || {};

    if (s.isFire) c.homeStyle = "clean";
    const styleOptions = canHome && s.isFire ? radio("style", "clean", "clean", "Minimal (CleanYourTV)", "Your apps in a tidy grid with Nuvio first. Horizon Home isn't offered on Fire TV.", true) : canHome ? radio("style", "horizon", c.homeStyle, "Horizon Home", `Artwork backdrop, Nuvio's Continue Watching, a Live TV guide, memory and weather in the top bar. About 160 MB.${c.nuvio === "nuvio-legacy-android" ? " Continue Watching needs the official Nuvio app." : ""}${!hz.tmdb ? " Add a TMDB key in Settings for artwork." : ""}`, rec.homeStyle === "horizon") +
      radio("style", "clean", c.homeStyle, "Minimal (CleanYourTV)", "Just your apps in a tidy grid with Nuvio first. Lightest on memory.", rec.homeStyle === "clean") : "";
    body += `<div class="group"><div class="head"><b>Home screen</b><span class="muted">no ads, Nuvio first</span></div>${styleOptions}${canHome ? `<div class="opt" style="padding-bottom:0"><span class="d">How it takes over Home</span></div>` : ""}${homeOptions}</div>`;

function checklist(kind) {
  return `<h3>Turn off ads in the TV's settings</h3><p class="small muted">This TV doesn't let apps change these, so here's where they are. Two minutes with the remote.</p>
    <ol class="howto">${AD_CHECKLIST[kind].map((t) => `<li><span>${t}</span></li>`).join("")}</ol>`;
}
function estimate() {
  const c = state.choices; let m = 1;
  if (c.nuvio !== "skip") m += 2; if (c.smarttube) m += 1; if (c.homeMode !== "none") m += 1; if (c.debloat.length) m += 1;
  return `About ${m} to ${m + 2} minutes`;
}

function bindPlan() {
  const c = state.choices;
  document.querySelectorAll('input[name="nuvio"]').forEach((el) => el.onchange = async () => {
    if (el.value === "custom") {
      const file = await pickFile(".apk");
      if (!file) { render(); return; }
      try { c.customApk = await upload(file); c.customApkName = file.name; c.nuvio = "custom"; } catch (e) { toast(e.message); }
      render(); return;
    }
    c.nuvio = el.value; setDock("Start setup", estimate(), startRun);
  });
  document.querySelectorAll('input[name="home"]').forEach((el) => el.onchange = () => { c.homeMode = el.value; });
  document.querySelectorAll('input[name="style"]').forEach((el) => el.onchange = () => { c.homeStyle = el.value; render(); });
  document.querySelectorAll('input[name="lgvar"]').forEach((el) => el.onchange = () => { c.nuvio = el.value; });
  { const el = document.querySelector('input[name="lghome"]'); if (el) el.onchange = () => { c.home = el.checked; }; }
  { const el = document.querySelector('input[name="lgboot"]'); if (el) el.onchange = () => { c.bootHome = el.checked; }; }
  const bindToggle = (name, key) => { const el = document.querySelector(`input[name="${name}"]`); if (el) el.onchange = () => { c[key] = el.checked; }; };
  bindToggle("speed", "speed"); bindToggle("smarttube", "smarttube"); bindToggle("replace", "replaceIncompatible"); bindToggle("dns", "dnsBlock");
  $("variant")?.addEventListener("change", (e) => { c.legacyVariant = e.target.value; });
  $("review-btn")?.addEventListener("click", openReview);
  $("undo-btn")?.addEventListener("click", startUndo);
}

function openReview() {
  const d = state.summary.debloat; const c = state.choices; const chosen = new Set(c.debloat);
  const html = `<h2>What gets turned off</h2>
    <p class="lede">${d.matched ? `Based on CleanYourTV's tested list for ${esc(d.matched.tv)}.` : "Based on lists for similar TVs."} The TV checks each one again before anything changes. Anything that runs inputs, Settings or Home is always kept.</p>
    ${d.categories.map((cat) => `<h3>${esc(cat.label)}</h3><p class="small muted" style="margin-top:-6px">${esc(cat.description)}</p>
      ${cat.items.map((i) => `<label class="pkg"><input type="checkbox" data-pkg="${esc(i.pkg)}" ${chosen.has(i.pkg) ? "checked" : ""}><span><code>${esc(i.pkg)}</code><span class="note">${esc(i.note || i.group)}</span></span></label>`).join("")}`).join("")}
    <div style="height:14px"></div><button class="btn full" id="sheet-done">Done</button>`;
  openSheet(html, () => {
    c.debloat = [...document.querySelectorAll("[data-pkg]")].filter((el) => el.checked).map((el) => el.dataset.pkg);
    render();
  });
  $("sheet-done").onclick = closeSheet;
}

let sheetClose = null;
function openSheet(html, onClose) {
  $("sheet-root").innerHTML = `<div class="scrim" id="scrim"></div><div class="sheet" role="dialog"><div class="grab"></div>${html}</div>`;
  sheetClose = onClose; $("scrim").onclick = closeSheet;
}
function closeSheet() { const fn = sheetClose; sheetClose = null; if (fn) fn(); $("sheet-root").innerHTML = ""; }

// ---------------- Developer mode guide ----------------
function viewGuide() {
  const profiles = (state.info?.profiles || []).filter((p) => p.id !== "samsung-old");
  const steps = (list) => `<ol class="howto">${list.map((x) => `<li><span>${x}</span></li>`).join("")}</ol>`;
  $("view").innerHTML = `<h2>Turn on developer mode</h2>
    <p class="lede">Each TV or box needs it once, so this phone can install apps and change settings over Wi-Fi. Nothing on the TV is changed until you start setup.</p>
    ${profiles.map((p) => { const g = GUIDES[p.id] || GUIDES.androidtv; return `<details class="help"><summary><span class="glyph">${esc(GLYPH[p.id] || "TV")}</span>${esc(p.label)}</summary><div class="inner">
      ${steps(g.steps)}${(g.more || []).map((m) => `<p class="small"><b>${esc(m.title)}</b></p>${steps(m.steps)}`).join("")}
      ${g.tips?.length ? `<p class="small"><b>Not working?</b></p><ul>${g.tips.map((t) => `<li>${t}</li>`).join("")}</ul>` : ""}
      <p class="small muted">Find the IP: ${g.ip}</p></div></details>`; }).join("")}
    <details class="help"><summary><span class="glyph">Sa</span>Older Samsung (2011 to 2017)</summary><div class="inner">
      <p class="small muted">Nuvio can't run on these, so there's nothing for this app to install. A streaming stick on the TV's HDMI port gets you Nuvio instead. For other apps:</p>
      <p class="small"><b>2015 to 2017 (Tizen)</b></p>${steps(GUIDES.samsung.steps.slice(0, 3))}
      ${Object.values(ORSAY).map((o) => `<p class="small"><b>${esc(o.label)}</b></p>${steps(o.steps)}`).join("")}
      <p class="small muted">2011 to 2014 sets load apps with User App Sync from a computer on the same Wi-Fi that serves <b>widgetlist.xml</b> on port 80. Phones can't serve on port 80, so this app can't run the sync.</p>
    </div></details>`;
  setDock("", "", null);
}

// ---------------- Older Samsung ----------------
function viewOldSamsung() {
  const old = state.old || (state.old = { model: "", year: 0 });
  $("view").innerHTML = `<h2>Older Samsung</h2>
    <p class="lede">Find the model number on the sticker on the back, or under Menu → Support → Contact Samsung (Settings → Support → About This TV on newer sets).</p>
    <label class="field"><span>Model number</span><input type="text" id="old-model" autocapitalize="characters" autocomplete="off" placeholder="UN46F6400" value="${esc(old.model || "")}"></label>
    <p class="small muted" style="margin-top:-6px">Or pick the year:</p>
    <div class="chips">${[2011, 2012, 2013, 2014, 2015, 2016, 2017].map((y) => `<button class="chip ${old.age?.year === y ? "on" : ""}" data-year="${y}">${y}</button>`).join("")}<button class="chip" data-year="2018">2018 or newer</button></div>
    <div id="old-body">${old.age ? oldSamsungBody(old, old.age) : ""}</div>`;
  const decode = async (patch) => {
    Object.assign(old, patch);
    old.age = await invoke("samsung:year", { model: old.model, year: patch.year || 0 }).catch(() => null);
    if (old.age?.year >= 2018) { go("connect", { target: { profile: "samsung", ip: old.ip || "" } }, true); return; }
    viewOldSamsung();
  };
  $("old-model").addEventListener("change", (e) => decode({ model: e.target.value.trim(), year: 0 }));
  document.querySelectorAll("[data-year]").forEach((el) => el.onclick = () => decode({ year: Number(el.dataset.year) }));
  if (!old.age && !old.tried && (old.model || old.year)) { old.tried = true; decode({ year: old.year || 0 }); }
  bindOldSamsung();
  if (old.age?.year && !old.age.supported) setDock("Set up a stick", "Fire TV Stick or onn box for this TV", () => go("pick"), { pulse: true });
  else setDock("Check", "Works out the TV's year", () => decode({ model: $("old-model").value.trim(), year: 0 }));
}

function oldSamsungBody(old, age) {
  if (!age?.year) return old.legacy
    ? `<div class="verdict warn"><b>A Samsung from 2015 or earlier</b><span class="small muted">It answers on the old remote-control port only. Enter the model number or pick the year above.</span></div>`
    : (old.model ? `<div class="verdict warn"><b>Couldn't read that model number</b><span class="small muted">Check the sticker again, or pick the year above.</span></div>` : "");
  const gen = age.generation;
  const why = gen === "orsay"
    ? "It runs Samsung's Smart Hub from before Tizen. Its apps are old web widgets, and Nuvio has never been built for it."
    : "Developer mode works on it, but Nuvio needs Tizen 4 (2018) or newer. The Nuvio Legacy developer has a Tizen 3 test build that isn't released, because it doesn't run well yet.";
  const series = gen === "orsay" ? ({ 2011: "D", 2012: "E", 2013: "F", 2014: "H" }[age.year] || "F") : "";
  return `<div class="verdict warn"><b>${age.year}${age.sure ? "" : "?"} Samsung, ${esc(age.os)}: Nuvio can't run on it</b><span class="small muted">${why}</span></div>
    <h3>Do this instead: a streaming stick</h3>
    <p class="small muted" style="margin-top:-4px">Plug one into a free HDMI port. This app then sets it up like any other TV: Nuvio, the clean home screen and the ad clean-up.</p>
    <div class="group">${STICKS.map(([t, d]) => `<div class="opt"><span><span class="t">${esc(t)}</span><span class="d">${esc(d)}</span></span></div>`).join("")}</div>
    <h3>On the Samsung</h3>
    <ol class="howto">${(OLD_SAMSUNG_TV[gen] || OLD_SAMSUNG_TV.orsay).map((t) => `<li><span>${t}</span></li>`).join("")}</ol>
    <details class="help"><summary>Developer mode on this TV, for other apps</summary><div class="inner">
      ${gen === "orsay" ? `<ol class="howto">${ORSAY[series].steps.map((x) => `<li><span>${x}</span></li>`).join("")}</ol>
        <p class="small muted">These are the steps for ${esc(ORSAY[series].label)} sets. User App Sync loads apps from a computer on the same Wi-Fi that serves <b>widgetlist.xml</b> on port 80, which phones can't do. If the <b>develop</b> login fails, Samsung's old login servers may be refusing it; a factory reset (Support → Self Diagnosis → Reset) before updating the firmware sometimes helps.</p>`
      : `<ol class="howto">${GUIDES.samsung.steps.slice(0, 3).map((x) => `<li><span>${x}</span></li>`).join("")}</ol><p class="small muted">The menus match newer Samsungs. It's only useful for apps built for Tizen ${esc((age.os.match(/[\d.]+/) || [""])[0])}.</p>`}
    </div></details>`;
}
function bindOldSamsung() {}

// ---------------- Running ----------------
async function startRun() {
  const s = state.summary;
  const choices = { ...state.choices };
  if (s.platform === "android" && choices.nuvio === "custom" && !choices.customApk) { toast("Pick your APK first."); return; }
  try {
    state.log = [];
    const { jobId } = await invoke("device:run", { profile: s.profile, ip: s.ip, choices, passphrase: state.target?.passphrase || "" });
    state.job = { id: jobId, status: "running", steps: [], title: "Setting up" };
    keepAwake(true);
    go("run");
  } catch (error) { toast(error.message, 5000); }
}
async function startUndo() {
  const s = state.summary;
  if (!confirm("Turn everything this app turned off back on, and bring back the original home screen?")) return;
  const { jobId } = await invoke("device:undo", { ip: s.ip, deviceKey: s.deviceKey });
  state.log = []; state.job = { id: jobId, status: "running", steps: [], title: "Undoing changes" };
  keepAwake(true); go("run");
}

function viewRun() {
  const j = state.job || { steps: [] };
  const stepHtml = j.steps.map((st) => {
    const color = { running: "blue", waiting: "yellow", done: "green", failed: "red" }[st.status] || "";
    return `<li class="${st.status}"><span class="dot ${color}"></span><span><span class="label">${esc(st.label)}</span>
      ${st.detail ? `<div class="detail">${esc(st.detail)}</div>` : ""}
      ${st.progress !== null && st.status === "running" ? `<div class="bar"><i style="width:${Math.round(st.progress * 100)}%"></i></div>` : ""}</span></li>`;
  }).join("");
  const failedSteps = j.steps.filter((st) => st.status === "failed");
  const done = j.status === "done" && !failedSteps.length; const partial = j.status === "done" && failedSteps.length > 0; const failed = j.status === "failed";
  $("view").innerHTML = `<h2>${esc(state.summary?.name || "Your TV")}</h2>
    <p class="lede">${done ? "All done." : partial ? "Mostly done. One part needs another try." : failed ? "Setup stopped." : "Keep this screen open. You can put the remote down unless a yellow step asks for you."}</p>
    <div id="signin-slot">${state.signinUrl && !done && !failed ? signinHtml() : ""}</div>
    <ul class="steps">${stepHtml}</ul>
    ${done ? `<div class="result ok"><b>Ready to watch.</b><p class="small muted" style="margin:6px 0 0">Nuvio is on the TV. Saved here so updates take one tap next time.</p></div>` : ""}
    ${partial ? `<div class="result bad"><b>${esc(failedSteps.map((st) => st.label).join(", "))} didn't finish</b><p class="small muted" style="margin:6px 0 0">${esc(failedSteps[0].detail)} Everything else is done. Running setup again only redoes what's needed.</p></div>` : ""}
    ${failed ? `<div class="result bad"><b>${esc(j.error || "Something went wrong")}</b><p class="small muted" style="margin:6px 0 0">Steps that finished stay done. Fix the problem above and run setup again; it picks up safely.</p></div>` : ""}
    <details class="log"><summary>Details</summary><div class="logbox" id="logbox">${state.log.map((l) => `<div class="${l.type}">${esc(l.text)}</div>`).join("")}</div></details>`;
  if (done || failed || partial) {
    keepAwake(false);
    const home = () => { state.stack = []; state.view = "home"; refreshInfo().then(render); };
    if (done || !state.summary || j.title === "Undoing changes") setDock("Done", "Back to your TVs", home, { pulse: done });
    else setDock("Try again", "Runs setup again; finished parts are quick", () => startRun());
  } else setDock("Working…", "Keep the app open", null, { enabled: false });
}
function signinHtml() {
  return `<div class="signin"><b>Sign in to Samsung once</b><p class="small muted" style="margin:6px 0 0">Samsung issues a certificate for this TV. Sign in in Chrome, then come back to this app; setup continues by itself.</p>
    <a class="cta" href="${esc(state.signinUrl)}">Sign in with Chrome</a>
    <div class="row"><button class="btn" id="signin-inapp">Use in-app sign-in</button><button class="btn" id="signin-copy">Copy link</button></div></div>`;
}
document.addEventListener("click", (e) => {
  if (e.target.id === "signin-inapp") bridge ? bridge.openLogin(state.signinUrl) : window.open(state.signinUrl, "_blank");
  if (e.target.id === "signin-copy") { bridge?.copyText(state.signinUrl); toast("Link copied. Paste it into Chrome."); }
});

// ---------------- Events from the phone's engine ----------------
function connectEvents() {
  const source = new EventSource(`/api/events?t=${encodeURIComponent(token)}`);
  source.onmessage = (message) => {
    const { channel, payload } = JSON.parse(message.data);
    if (channel === "job:update" && state.job && payload.id === state.job.id) {
      state.job = payload;
      if (payload.status !== "running") state.signinUrl = "";
      if (state.view === "run") viewRun();
    } else if (channel === "installer:log") {
      state.log.push(payload); if (state.log.length > 1500) state.log.shift();
      const box = $("logbox");
      if (box) { const div = document.createElement("div"); div.className = payload.type || ""; div.textContent = payload.text; box.appendChild(div); box.scrollTop = box.scrollHeight; }
      if (/certificate created/i.test(payload.text || "")) { state.signinUrl = ""; if (state.view === "run") viewRun(); }
    } else if (channel === "installer:openExternal") {
      state.signinUrl = payload.url; if (state.view === "run") viewRun();
    } else if (channel === "installer:clipboard") {
      bridge?.copyText(payload.text);
    } else if (channel === "scan:progress") {
      state.scan.fraction = payload.fraction; const bar = document.querySelector(".scanbar i"); if (bar) bar.style.width = `${Math.round(payload.fraction * 100)}%`;
    } else if (channel === "scan:found") {
      if (!state.scan.found.some((f) => f.ip === payload.ip)) state.scan.found.push(payload);
      if (state.view === "home") viewHome();
    } else if (channel === "device:authPrompt") {
      $("dock-hint").innerHTML = "<b>Look at the TV</b><span>Choose Allow and tick Always allow</span>";
      toast("Look at the TV: choose Allow on “Allow USB debugging?”", 6000);
    }
  };
  source.onerror = () => { source.close(); setTimeout(connectEvents, 1500); };
}

// ---------------- Saved device actions ----------------
function openDevice(id) {
  const d = state.info.devices.find((item) => item.id === id);
  if (!d) return;
  openSheet(`<h2>${esc(d.name)}</h2><p class="lede">${esc(d.ip)}, ${esc(d.os || d.platform)}</p>
    <button class="key" id="dv-setup"><span class="grow"><span class="title">${d.lastSetup ? "Update Nuvio and re-run setup" : "Set up this TV"}</span><span class="sub">Connects, then shows the plan before changing anything</span></span><span class="chev">›</span></button>
    ${d.platform === "android" ? `<button class="key" id="dv-open"><span class="grow"><span class="title">Open Nuvio on the TV</span></span><span class="chev">›</span></button>` : ""}
    <div style="height:8px"></div><button class="btn full danger" id="dv-remove">Forget this TV</button>`);
  $("dv-setup").onclick = () => { closeSheet(); go("connect", { target: { profile: d.profile, ip: d.ip, passphrase: "" } }); setTimeout(connectNow, 50); };
  $("dv-open")?.addEventListener("click", async () => { try { await invoke("device:launch", { ip: d.ip, pkg: d.choices?.nuvio === "nuvio-legacy-android" ? "space.nuvio.nativelegacy" : "com.nuvio.tv" }); toast("Opening on the TV"); } catch (e) { toast(e.message); } closeSheet(); });
  $("dv-remove").onclick = async () => { await invoke("device:remove", id); closeSheet(); await refreshInfo(); render(); };
}

// ---------------- Settings ----------------
async function openSettings() {
  await refreshInfo();
  const s = state.info.settings; const mb = Math.round((state.info.storageBytes || 0) / 1048576);
  openSheet(`<h2>Settings</h2>
    <div class="group">
      ${toggle("set-auto", s.autoPrepare, "Prepare downloads when the app opens", "Fetches new Nuvio builds for your saved TVs ahead of time, so setup at the TV only uploads.")}
      ${toggle("set-all", s.prepareAllPlatforms, "Keep every build on this phone", "About 600 MB. Handy for setting up other people's TVs with no internet at their place.")}
    </div>
    <div class="row"><button class="btn" id="prep-now">Prepare now</button><button class="btn" id="clear">Clear downloads (${mb} MB)</button></div>
    <h3>Horizon Home</h3><p class="small muted">Used when you pick Horizon as an Android TV home screen. Stored only on this phone and on the TVs you set up.</p>
    <label class="field"><span>Name for the greeting</span><input type="text" id="hz-name" value="${esc(s.horizon?.name || "")}"></label>
    <label class="field"><span>TMDB API key (artwork). Free at <a class="link" href="https://www.themoviedb.org/settings/api">themoviedb.org</a></span><input type="text" id="hz-tmdb" autocomplete="off" value="${esc(s.horizon?.tmdb || "")}"></label>
    <label class="field"><span>Live TV addon link (for the TV guide)</span><input type="text" id="hz-livetv" autocomplete="off" placeholder="https://…workers.dev/…" value="${esc(s.horizon?.livetv || "")}"></label>
    <label class="field"><span>NextDNS profile ID (optional, ad blocking)</span><input type="text" id="hz-ndid" autocomplete="off" value="${esc(s.horizon?.nextdnsId || "")}"></label>
    <label class="field"><span>NextDNS API key (optional, "ads blocked today" counter)</span><input type="password" id="hz-ndkey" autocomplete="off" value="${esc(s.horizon?.nextdnsKey || "")}"></label>
    <h3>Samsung certificate</h3><p class="small muted">Back it up so a new phone can update Samsung TVs without signing in again.</p>
    <label class="field"><span>Backup password</span><input type="password" id="cert-pass"></label>
    <div class="row"><button class="btn" id="cert-export">Back up</button><button class="btn" id="cert-import">Restore</button></div>
    <h3>Help</h3><button class="key" id="guide-open"><span class="grow"><span class="title">How to turn on developer mode</span><span class="sub">Samsung, LG, Android TV, Shield, onn, Sony, Fire TV, older Samsung</span></span><span class="chev">›</span></button>
    <h3>About</h3><p class="small muted">TV Setup ${esc(state.info.version)}. Horizon Home from Horizon Home Kit (MIT). Debloat lists and minimal home screen from CleanYourTV (MIT, ${esc(state.info.lists.count)} tested lists). Nuvio Legacy by iqui27. Nuvio by NuvioMedia. <a class="link" href="legacy-installer.html?t=${encodeURIComponent(token)}">Old Samsung installer</a></p>`, () => {});
  const save = async () => { state.info.settings = await invoke("settings:set", { autoPrepare: document.querySelector('[name="set-auto"]').checked, prepareAllPlatforms: document.querySelector('[name="set-all"]').checked }); };
  document.querySelector('[name="set-auto"]').onchange = save; document.querySelector('[name="set-all"]').onchange = save;
  const saveHorizon = async () => {
    state.info.settings = await invoke("settings:set", { horizon: { name: $("hz-name").value.trim(), tmdb: $("hz-tmdb").value.trim(), livetv: $("hz-livetv").value.trim(), nextdnsId: $("hz-ndid").value.trim(), nextdnsKey: $("hz-ndkey").value.trim() } });
    toast("Saved");
  };
  ["hz-name", "hz-tmdb", "hz-livetv", "hz-ndid", "hz-ndkey"].forEach((id) => $(id).addEventListener("change", saveHorizon));
  $("guide-open").onclick = () => { closeSheet(); go("guide"); };
  $("prep-now").onclick = () => { closeSheet(); prepare(true); };
  $("clear").onclick = async () => { await invoke("storage:clear"); toast("Downloads cleared"); closeSheet(); };
  $("cert-export").onclick = async () => {
    try { const r = await invoke("certs:export", $("cert-pass").value); bridge ? bridge.saveFile(r.fileName, r.text) : toast("Saved"); toast(`Backed up ${r.tvCount} TV certificate(s)`); } catch (e) { toast(e.message, 5000); }
  };
  $("cert-import").onclick = async () => {
    const file = await pickFile(".json,.txt,application/json"); if (!file) return;
    try { const r = await invoke("certs:import", $("cert-pass").value, await file.text()); toast(`Restored ${r.tvCount ?? ""} certificate(s)`); } catch (e) { toast(e.message, 5000); }
  };
}

async function prepare(manual = false) {
  try {
    const r = await invoke("prepare:run", { all: false });
    if (manual && r.nothing) toast("Set up a TV first, or turn on Keep every build.");
    else if (manual) toast("Preparing downloads in the background");
  } catch (e) { if (manual) toast(e.message); }
}

async function refreshInfo() { state.info = await invoke("app:info"); }

(async () => {
  connectEvents();
  try { await refreshInfo(); } catch (e) { toast(e.message); }
  render();
  if (state.info?.settings?.autoPrepare) setTimeout(() => prepare(false), 2500);
  if (state.info?.devices?.some((d) => d.platform === "lg")) invoke("lg:extendAll").catch(() => {});
  if (!(state.info?.devices || []).length) setTimeout(runScan, 600);
})();
</script>
