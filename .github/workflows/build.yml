name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Syntax check Node and UI code
        run: |
          node --check nodejs-project/server.js
          for f in nodejs-project/src/*.js; do node --check "$f"; done
          sed -n '/<script>/,/<\/script>/p' nodejs-project/ui/index.html | sed '1d;$d' > /tmp/ui.js
          node --check /tmp/ui.js

      - name: Read version
        id: ver
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Repack APK
        run: python3 scripts/repack.py base/NuvioPlex-TV-Installer-1.2.3.apk nodejs-project unsigned.apk

      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASS" ]; then
            echo "::error::Set the SIGNING_KEYSTORE_B64 and SIGNING_PASSWORD repo secrets."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > signing.jks
          curl -sSL -o uber.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar
          java -jar uber.jar -a unsigned.apk -o out \
            --ks signing.jks --ksAlias nuviotizen --ksPass "$KEYSTORE_PASS" --ksKeyPass "$KEYSTORE_PASS"
          mkdir -p dist
          cp out/*-aligned-signed.apk "dist/NuvioTizenInstaller.apk"
          cp out/*-aligned-signed.apk "dist/NuvioTizenInstaller-${{ steps.ver.outputs.version }}.apk"
          rm -f signing.jks

      - uses: actions/upload-artifact@v4
        with:
          name: NuvioTizenInstaller-${{ steps.ver.outputs.version }}
          path: dist/*.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.ver.outputs.version }}"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" dist/*.apk --title "Nuvio Tizen Installer $TAG" --notes-file CHANGELOG.md --latest
